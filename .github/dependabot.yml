version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    # Dependency bumps are contributions like any other: they land on dev and
    # reach main only through the integration branch.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      go-runtime:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns:
          - "*"
