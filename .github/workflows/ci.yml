name: Main gate

# The gated pass. Every job here is a required check on main: a pull request
# from dev merges only when all of them are green, and there is no bypass.
#
# It deliberately does not run on dev. dev-pass.yml gives faster feedback there,
# and dev is allowed to be red.
#
# The job names below ARE the required check contexts in the "main is released
# code" ruleset. Renaming one creates a required check that never reports, which
# blocks every merge into main while looking correct. Change the ruleset in the
# same commit or not at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ""
  CODEFLUX_LIVE_PROVIDER: ""
  GOTOOLCHAIN: local
  OPENAI_API_KEY: ""

jobs:
  quality:
    name: Quality (Windows 11 ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum
      - name: Install pinned Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Check formatting, vet, lint, migrations, and secrets
        run: go run ./cmd/codeflux-dev lint
      - name: Check artifact boundary after lint
        if: always()
        run: go run ./cmd/codeflux-dev artifact-check
      - name: Check deterministic generation
        run: go run ./cmd/codeflux-dev generate-check
      - name: Check artifact boundary after generation
        if: always()
        run: go run ./cmd/codeflux-dev artifact-check
      - name: Run unit tests with coverage
        run: go run ./cmd/codeflux-dev test-coverage
      - name: Check artifact boundary after tests
        if: always()
        run: go run ./cmd/codeflux-dev artifact-check
      - name: Build
        run: go run ./cmd/codeflux-dev build
      - name: Check artifact boundary after build
        if: always()
        run: go run ./cmd/codeflux-dev artifact-check
      - name: Create allow-listed failure metadata
        if: failure()
        run: go run ./cmd/codeflux-dev ci-failure-artifact
      - name: Upload redacted failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-windows-arm64-failure
          path: .artifacts/test-failures/context.json
          if-no-files-found: error
          retention-days: 7

  platform:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 ARM64
            runner: windows-11-arm
          - name: Windows Server 2025 AMD64
            runner: windows-2025
          - name: macOS 15 ARM64
            runner: macos-15
          - name: Ubuntu 24.04 AMD64
            runner: ubuntu-24.04
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum
      - name: Run fast tests
        run: go run ./cmd/codeflux-dev test-fast
      - name: Check artifact boundary after tests
        if: always()
        run: go run ./cmd/codeflux-dev artifact-check
      - name: Build
        run: go run ./cmd/codeflux-dev build
      - name: Check artifact boundary after build
        if: always()
        run: go run ./cmd/codeflux-dev artifact-check
      - name: Create allow-listed failure metadata
        if: failure()
        run: go run ./cmd/codeflux-dev ci-failure-artifact
      - name: Upload redacted failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.runner }}-failure
          path: .artifacts/test-failures/context.json
          if-no-files-found: error
          retention-days: 7

  race:
    name: Race tests (Ubuntu 24.04 AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum
      - name: Run race tests
        run: go run ./cmd/codeflux-dev test-race
      - name: Check artifact boundary after race tests
        if: always()
        run: go run ./cmd/codeflux-dev artifact-check
      - name: Create allow-listed failure metadata
        if: failure()
        run: go run ./cmd/codeflux-dev ci-failure-artifact
      - name: Upload redacted failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: race-ubuntu-amd64-failure
          path: .artifacts/test-failures/context.json
          if-no-files-found: error
          retention-days: 7
