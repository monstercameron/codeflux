syntax = "proto3";

package codeflux.v1;

option go_package = "codeflux.dev/codeflux/api/gen/codeflux/v1;codefluxv1";

import "codeflux/v1/conventions.proto";
import "codeflux/v1/identity.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message WorkspaceView {
  StableIdentity workspace_id = 1;
  StableIdentity repository_id = 2;
  SafePath root = 3;
  GitStateView git = 4;
  uint64 revision = 5;
  repeated RedactedText warnings = 6;
  google.protobuf.Timestamp observed_at = 7;
}

message RepositorySummary {
  StableIdentity repository_id = 1;
  RedactedText display_name = 2;
  SafePath root = 3;
  GitStateView git = 4;
  uint64 revision = 5;
}

message ThreadView {
  StableIdentity thread_id = 1;
  StableIdentity workspace_id = 2;
  RedactedText title = 3;
  bool archived = 4;
  uint64 revision = 5;
  google.protobuf.Timestamp updated_at = 6;
  StableIdentity session_id = 7;
  StableIdentity task_id = 8;
  string task_state = 9;
  string attention = 10;
  uint32 unread_count = 11;
  // Project scope is required by task-owned resources such as GraphService.
  // It is a typed identity only and does not expose repository content.
  StableIdentity project_id = 12;
}

message MessageView {
  StableIdentity message_id = 1;
  StableIdentity thread_id = 2;
  string role = 3;
  RedactedText body = 4;
  // SafePath is retained for wire compatibility with older clients.
  repeated SafePath attachments = 5;
  uint64 revision = 6;
  google.protobuf.Timestamp created_at = 7;
  repeated StableIdentity attachment_ids = 8;
  uint64 sequence = 9;
}

message TaskView {
  StableIdentity task_id = 1;
  StableIdentity thread_id = 2;
  StableIdentity session_id = 3;
  string state = 4;
  uint64 revision = 5;
  uint64 plan_revision = 6;
  RedactedText summary = 7;
  Money actual_cost = 8;
  Money hard_budget = 9;
  TokenAmount actual_tokens = 10;
  google.protobuf.Duration elapsed = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Revision of the authoritative budget aggregate. It may legitimately be
  // zero for a newly created budget; clients pair it with hard_budget
  // presence and use it for SetBudget rather than the independent task
  // revision.
  uint64 budget_revision = 13;
  string selected_provider = 14;
  string selected_model = 15;
  string selected_effort = 16;
  TaskForecastView forecast = 17;
  repeated string actual_pricing_snapshot_ids = 18;
  Money remaining_hard_budget = 19;
  Money warning_threshold = 20;
  bool warning_reached = 21;
  bool hard_cap_reached = 22;
  // Presence distinguishes an authoritative false value from unavailable
  // provider-settlement state.
  optional bool settling_provider_request = 23;
  StableIdentity latest_checkpoint_id = 24;
  string latest_checkpoint_state = 25;
  string latest_checkpoint_plan_step = 26;
}

// TaskForecastView is the latest immutable transparent forecast. Optional
// Money values stay absent when their exact rational value is not representable
// as integral currency minor units; servers must never round them.
message TaskForecastView {
  string algorithm_version = 1;
  string estimate_notice = 2;
  bool latency_known = 3;
  int64 latency_p50_ms = 4;
  int64 latency_p90_ms = 5;
  bool tokens_known = 6;
  uint64 tokens_p50 = 7;
  uint64 tokens_p90 = 8;
  Money cost_p50 = 9;
  Money cost_p90 = 10;
  string price_snapshot_id = 11;
  string price_source = 12;
  google.protobuf.Timestamp price_captured_at = 13;
  repeated string uncertainty_reasons = 14;
  uint64 revision = 15;
}

message BudgetView {
  StableIdentity budget_id = 1;
  StableIdentity task_id = 2;
  Money hard_limit = 3;
  Money reserved = 4;
  Money actual = 5;
  uint64 revision = 6;
}

message GraphNodeView {
  StableIdentity node_id = 1;
  string kind = 2;
  string state = 3;
  RedactedText label = 4;
  SafePath source_path = 5;
  uint32 source_line = 6;
  uint32 rank = 7;
  RedactedText contract_purpose = 8;
  repeated RedactedText contract_inputs = 9;
  repeated RedactedText contract_outputs = 10;
  repeated RedactedText contract_effects = 11;
  bool tombstoned = 12;
  repeated StableIdentity related_message_ids = 13;
  repeated StableIdentity event_ids = 14;
  repeated GraphPlanStepLinkView plan_steps = 15;
  repeated GraphSourceLocationView source_locations = 16;
  GraphLayoutHintView layout = 17;
}

message GraphEdgeView {
  StableIdentity edge_id = 1;
  StableIdentity from_node_id = 2;
  StableIdentity to_node_id = 3;
  string kind = 4;
  bool tombstoned = 5;
  repeated StableIdentity event_ids = 6;
  repeated GraphPlanStepLinkView plan_steps = 7;
}

message GraphPlanStepLinkView {
  uint64 plan_revision = 1;
  string step_id = 2;
}

message GraphSourceLocationView {
  StableIdentity repository_id = 1;
  string repository_revision = 2;
  SafePath repository_relative_path = 3;
  uint32 start_line = 4;
  uint32 start_column = 5;
  uint32 end_line = 6;
  uint32 end_column = 7;
}

message GraphLayoutHintView {
  string algorithm = 1;
  uint64 algorithm_version = 2;
  sint64 x_milli = 3;
  sint64 y_milli = 4;
  uint64 width_milli = 5;
  uint64 height_milli = 6;
  uint64 rank = 7;
  uint64 sibling_order = 8;
}

message GraphSliceView {
  StableIdentity graph_id = 1;
  StableIdentity graph_revision_id = 2;
  StableIdentity task_id = 3;
  uint64 revision = 4;
  repeated GraphNodeView nodes = 5;
  repeated GraphEdgeView edges = 6;
  string continuation_cursor = 7;
  bool truncated = 8;
  string mode = 9;
  uint32 graph_schema_version = 10;
  string content_sha256 = 11;
  string layout_algorithm = 12;
  uint64 layout_algorithm_version = 13;
  google.protobuf.Timestamp created_at = 14;
  StableIdentity parent_graph_revision_id = 15;
}

message GraphRevisionChangeView {
  string entity_kind = 1;
  string change_kind = 2;
  string stable_id = 3;
  GraphNodeView before_node = 4;
  GraphNodeView after_node = 5;
  GraphEdgeView before_edge = 6;
  GraphEdgeView after_edge = 7;
}

message DiffSummaryView {
  StableIdentity task_id = 1;
  string diff_identity = 2;
  uint64 task_revision = 3;
  uint32 changed_files = 4;
  uint64 added_lines = 5;
  uint64 deleted_lines = 6;
  RedactedText summary = 7;
}

message ValidationItemView {
  StableIdentity validation_id = 1;
  string state = 2;
  string guarantee_level = 3;
  RedactedText summary = 4;
}

message ValidationReportView {
  StableIdentity task_id = 1;
  string diff_identity = 2;
  uint64 revision = 3;
  repeated ValidationItemView items = 4;
  RedactedText summary = 5;
}

message ModelView {
  StableIdentity provider_id = 1;
  string model_id = 2;
  RedactedText display_name = 3;
  bool available = 4;
  google.protobuf.Duration default_timeout = 5;
}

message PolicyView {
  string preset = 1;
  string reasoning_effort = 2;
  string risk = 3;
  string required_assurance = 4;
  uint64 revision = 5;
}

message ProviderView {
  StableIdentity provider_id = 1;
  RedactedText display_name = 2;
  string credential_reference = 3;
  bool configured = 4;
  uint64 revision = 5;
}
