  rpc SetBudgetDefaults(SetBudgetDefaultsRequest) returns (SetBudgetDefaultsResponse);
  rpc ConfigureProvider(ConfigureProviderRequest) returns (ConfigureProviderResponse);
  rpc TestProvider(TestProviderRequest) returns (TestProviderResponse);
  rpc RecordFrontendTelemetry(RecordFrontendTelemetryRequest) returns (RecordFrontendTelemetryResponse);
  rpc ListFrontendTelemetry(ListFrontendTelemetryRequest) returns (ListFrontendTelemetryResponse);
  rpc DeleteFrontendTelemetry(DeleteFrontendTelemetryRequest) returns (DeleteFrontendTelemetryResponse);
}

message GetModelsRequest {
  StableIdentity workspace_id = 1;
}

message GetModelsResponse {
  repeated ModelView models = 1;
}

message GetPolicyRequest {
  StableIdentity workspace_id = 1;
}

message GetPolicyResponse {
