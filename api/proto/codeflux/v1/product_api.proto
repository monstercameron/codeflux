  StableIdentity workspace_id = 2;
  Money default_hard_limit = 3;
}

message SetBudgetDefaultsResponse {
  Money default_hard_limit = 1;
  uint64 revision = 2;
}

message ConfigureProviderRequest {
  MutationControl control = 1;
  StableIdentity workspace_id = 2;
  StableIdentity provider_id = 3;
  string credential_reference = 4;
  string model_id = 5;
}

message ConfigureProviderResponse {
