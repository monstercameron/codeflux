// GetEvidenceReport reads one sealed structured report and, when requested,
// the current bounded review diff. An empty report_id selects the latest
// sealed report for the task. The response explicitly says whether the live
// diff still matches the immutable report binding.
message GetEvidenceReportRequest {
  StableIdentity task_id = 1;
  string report_id = 2;
  bool include_diff = 3;
}

message ReviewPlanStepLinkView {
  uint64 plan_revision = 1;
  string step_id = 2;
}

message ReviewValidationLinkView {
  StableIdentity validation_id = 1;
  string state = 2;
  RedactedText label = 3;
  RedactedText summary = 4;
}

message ReviewDiffFileView {
  SafePath path = 1;
  SafePath previous_path = 2;
  string status = 3;
  string category = 4;
  uint64 added_lines = 5;
  uint64 deleted_lines = 6;
  bool line_counts_known = 7;
  RedactedText line_counts_unknown_reason = 8;
  bool binary = 9;
  bool formatting_churn = 10;
  bool scope_known = 11;
  bool in_scope = 12;
  RedactedText scope_unknown_reason = 13;
  repeated ReviewPlanStepLinkView plan_steps = 14;
  repeated StableIdentity tool_event_ids = 15;
  repeated ReviewValidationLinkView validations = 16;
}

message ReviewDiffView {
  StableIdentity task_id = 1;
  string diff_identity = 2;
  string base_revision = 3;
  string head_revision = 4;
  RedactedText unified_diff = 5;
  repeated ReviewDiffFileView files = 6;
}

message GetEvidenceReportResponse {
  // Canonical JSON encoding of the validated evidence.Report value. It is
  // bounded by the service and contains structured fields, never Markdown.
  bytes structured_report_json = 1;
  ReviewDiffView diff = 2;
  bool diff_matches_report = 3;
  string review_id = 4;
  uint64 review_revision = 5;
}

