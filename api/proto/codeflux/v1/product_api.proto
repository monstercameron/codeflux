}

message RequestRepairRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  string feedback = 3;
  repeated StableIdentity evidence_ids = 4;
  string review_id = 5;
  uint64 expected_review_revision = 6;
  string expected_report_id = 7;
  string expected_diff_identity = 8;
  repeated ReviewRepairTarget targets = 9;
  StableIdentity checkpoint_id = 10;
  StableIdentity feedback_message_id = 11;
}

message ReviewRepairTarget {
  string kind = 1;
  string id = 2;
}

message RequestRepairResponse {
  TaskView task = 1;
  uint64 plan_revision = 2;
  string repair_request_id = 3;
  StableIdentity pre_repair_checkpoint_id = 4;
}

message RollbackTaskRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  StableIdentity checkpoint_id = 3;
  string repair_request_id = 4;
  string expected_repair_diff_identity = 5;
  RedactedText reason = 6;
}

message RollbackTaskResponse {
  TaskView task = 1;
  string rollback_intent_id = 2;
  string observed_diff_identity = 3;
}

message PreserveRecoveryPatchRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  string reason = 3;
}

message PreserveRecoveryPatchResponse {
  StableIdentity task_id = 1;
