// PipelineStageService reads the pipeline stage ledger one task attempt
// produced: internal/coordinator's own record of how far the delivery flow
// actually got, stage by stage, distinct from the generic SessionEvent
// stream that reports live plan/tool/approval activity but carries no stage
// number or per-stage timing (PIPE-006b).
//
// It is a plain on-demand read rather than a durable session event. The
// ledger's rows are immutable and already fully written by the time a caller
// could subscribe to them -- RecordPipelineStageResult persists a stage before
// this surface could ever announce it -- and they are addressed by task and
// attempt rather than delivered in a live per-session order, which matches
// the pull-based GetDiffSummary/GetValidationReport/GetEvidenceReport shape
// in this file rather than SessionEvent's push-based one. A live progress
// view of a run in flight is a different concern, already served by the
// existing tool/plan session events; this surface is the retrospective,
// evidence-grade record a review or audit reads afterward.
service PipelineStageService {
  // ListPipelineStages returns one task attempt's recorded flow, in stage
  // order. The result is bounded by the flow's own fixed, schema-enforced
  // length; it is not paginated.
  rpc ListPipelineStages(ListPipelineStagesRequest) returns (ListPipelineStagesResponse);
}

// PipelineStageView is one recorded stage of the delivery flow: its position,
// its name, its verdict, and how long it took to reach.
//
// It intentionally does not carry the stage's gate text or evidence payload;
// this surface answers "how far did this attempt get and how long did each
// stage take", not "what did each stage produce".
message PipelineStageView {
  // stage_number is the stage's position in the flow. It is not the stage's
  // identity -- inserting a stage shifts every number after it -- so a reader
  // comparing stages across product versions should match on stage_name.
  uint32 stage_number = 1;
  string stage_name = 2;
  // state is one of "satisfied", "failed", "skipped", "blocked", or
  // "not-implemented".
  string state = 3;
  // finished_at is when this stage was recorded. It is always known: every
  // recorded stage has a finish time, tracked or not.
  google.protobuf.Timestamp finished_at = 4;
  // elapsed_measured reports whether this stage's start was actually tracked.
  // A stage recorded with no tracked start reports its finish time as its
  // start too, which is indistinguishable from a genuinely instantaneous
  // stage unless this flag travels with elapsed. A client must not read a
  // zero elapsed as "instant" when this is false.
  bool elapsed_measured = 5;
  // elapsed is the wall-clock span from the previous stage's own record to
  // this one -- not this stage's own processing time, and not meaningful
  // concurrently with a future pipeline that runs stages in parallel. It is
  // meaningful only when elapsed_measured is true; a client must not display
  // it otherwise.
  google.protobuf.Duration elapsed = 6;
}

message ListPipelineStagesRequest {
  StableIdentity task_id = 1;
  // attempt selects one run's ledger. Zero selects attempt one, matching
  // storage.ListPipelineStages's own default; this request does not resolve
  // "the latest attempt" on a caller's behalf.
  uint64 attempt = 2;
}

message ListPipelineStagesResponse {
  repeated PipelineStageView stages = 1;
  // attempt echoes the attempt the stages were actually read for, so a caller
  // that sent zero can see which attempt it got.
  uint64 attempt = 2;
}

// MemoryService reads governed project memory.
//
// The surface is read-only. Memory artifacts are created by the coordinator
// from evidence it observed, and their maturity is governed by transition
// rules the browser has no authority over; a client that could write here
// could launder an assertion into a durable fact.
service MemoryService {
  rpc ListMemoryArtifacts(ListMemoryArtifactsRequest) returns (ListMemoryArtifactsResponse);
  rpc GetMemoryArtifact(GetMemoryArtifactRequest) returns (GetMemoryArtifactResponse);
}

message ListMemoryArtifactsRequest {
  StableIdentity project_id = 1;
  PageRequest page = 2;
}

// MemoryArtifactSummary is one artifact at its latest revision, carrying only
// what the inspector lists: identity, kind, governed maturity, and a redacted
// one-line summary. Content and evidence stay behind the detail read.
message MemoryArtifactSummary {
  StableIdentity artifact_id = 1;
  StableIdentity revision_id = 2;
  string kind = 3;
  string maturity = 4;
  RedactedText summary = 5;
  bool created_from_correction = 6;
  StableIdentity scope_repository_id = 7;
  google.protobuf.Timestamp created_at = 8;
  uint64 revision_number = 9;
}

message ListMemoryArtifactsResponse {
  repeated MemoryArtifactSummary artifacts = 1;
  PageInfo page = 2;
}

message GetMemoryArtifactRequest {
  StableIdentity project_id = 1;
  StableIdentity artifact_id = 2;
}

// MemoryArtifactLineageView is what the artifact was derived from and what
// influenced it. Origin and supporting episodes carry an explicit known flag:
// an unresolved origin is reported as unresolved rather than shown as "none",
// because those two claims are not the same and only one of them is true.
message MemoryArtifactLineageView {
  repeated StableIdentity derived_from = 1;
  repeated StableIdentity influenced_by = 2;
  bool origin_known = 3;
  StableIdentity origin_artifact_id = 4;
  string origin_unknown_reason = 5;
  bool supporting_episodes_known = 6;
  repeated StableIdentity supporting_episodes = 7;
  string supporting_episodes_unknown_reason = 8;
}

// MemoryArtifactField is one already-redacted line of an artifact's typed
// content, rendered as a label and value pair. Sending the payload this way
// keeps the browser from having to know eight content shapes to display them.
message MemoryArtifactField {
  string label = 1;
  RedactedText value = 2;
}

message GetMemoryArtifactResponse {
  MemoryArtifactSummary summary = 1;
  repeated MemoryArtifactField fields = 2;
  MemoryArtifactLineageView lineage = 3;
  StableIdentity supersedes_revision_id = 4;
  string binding_state = 5;
  string content_sha256 = 6;
}

