syntax = "proto3";

package codeflux.v1;

option go_package = "codeflux.dev/codeflux/api/gen/codeflux/v1;codefluxv1";

import "codeflux/v1/conventions.proto";
import "codeflux/v1/identity.proto";
import "codeflux/v1/resources.proto";
import "codeflux/v1/session.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service WorkspaceService {
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (OpenWorkspaceResponse);
  rpc GetWorkspaceState(GetWorkspaceStateRequest) returns (GetWorkspaceStateResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc InspectRepository(InspectRepositoryRequest) returns (InspectRepositoryResponse);
}

message OpenWorkspaceRequest {
  MutationControl control = 1;
  string selected_path = 2;
}

message OpenWorkspaceResponse {
  WorkspaceView workspace = 1;
}

message GetWorkspaceStateRequest {
  StableIdentity workspace_id = 1;
}

message GetWorkspaceStateResponse {
  WorkspaceView workspace = 1;
}

message ListRepositoriesRequest {
  PageRequest page = 1;
}

message ListRepositoriesResponse {
  repeated RepositorySummary repositories = 1;
  PageInfo page = 2;
}

message InspectRepositoryRequest {
  StableIdentity repository_id = 1;
}

message InspectRepositoryResponse {
  RepositorySummary repository = 1;
  repeated RedactedText warnings = 2;
  // working_tree_read reports whether Git actually answered. Without it a
  // caller cannot tell a clean tree from a tree nobody could read: both arrive
  // as a summary with dirty unset, and "clean" is the claim somebody starts an
  // agent on the strength of.
  bool working_tree_read = 3;
}

service ThreadService {
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThreadPage(GetThreadPageRequest) returns (GetThreadPageResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc RenameThread(RenameThreadRequest) returns (RenameThreadResponse);
  rpc ArchiveThread(ArchiveThreadRequest) returns (ArchiveThreadResponse);
}

message CreateThreadRequest {
  MutationControl control = 1;
  StableIdentity workspace_id = 2;
  string title = 3;
}

message CreateThreadResponse {
  ThreadView thread = 1;
}

message ListThreadsRequest {
  StableIdentity workspace_id = 1;
  PageRequest page = 2;
  bool include_archived = 3;
}

message ListThreadsResponse {
  repeated ThreadView threads = 1;
  PageInfo page = 2;
}

message GetThreadPageRequest {
  StableIdentity thread_id = 1;
  PageRequest page = 2;
}

message GetThreadPageResponse {
  ThreadView thread = 1;
  repeated MessageView messages = 2;
  PageInfo page = 3;
}

message SendMessageRequest {
  MutationControl control = 1;
  StableIdentity thread_id = 2;
  string body = 3;
  // Legacy browser-supplied paths are retained for wire compatibility only.
  // Servers reject non-empty values; clients send repository-scoped identities.
  repeated string attachment_paths = 4;
  bool create_draft_task = 5;
  repeated StableIdentity attachment_ids = 6;
}

message SendMessageResponse {
  MessageView message = 1;
  TaskView draft_task = 2;
}

message RenameThreadRequest {
  MutationControl control = 1;
  StableIdentity thread_id = 2;
  string title = 3;
}

message RenameThreadResponse {
  ThreadView thread = 1;
}

message ArchiveThreadRequest {
  MutationControl control = 1;
  StableIdentity thread_id = 2;
  bool archived = 3;
}

message ArchiveThreadResponse {
  ThreadView thread = 1;
}

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ApprovePlan(ApprovePlanRequest) returns (ApprovePlanResponse);
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse);
  rpc PauseTask(PauseTaskRequest) returns (PauseTaskResponse);
  rpc ResumeTask(ResumeTaskRequest) returns (ResumeTaskResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc ApproveAction(ApproveActionRequest) returns (ApproveActionResponse);
  rpc SetBudget(SetBudgetRequest) returns (SetBudgetResponse);
  rpc RequestRepair(RequestRepairRequest) returns (RequestRepairResponse);
  rpc RollbackTask(RollbackTaskRequest) returns (RollbackTaskResponse);
  rpc PreserveRecoveryPatch(PreserveRecoveryPatchRequest) returns (PreserveRecoveryPatchResponse);
  rpc ReconcileRecovery(ReconcileRecoveryRequest) returns (ReconcileRecoveryResponse);
  rpc SafeResumeRecovery(SafeResumeRecoveryRequest) returns (SafeResumeRecoveryResponse);
}

message CreateTaskRequest {
  MutationControl control = 1;
  StableIdentity thread_id = 2;
  StableIdentity source_message_id = 3;
  string requirement = 4;

  // The declared shape of the task. These are supplied by the caller rather
  // than inferred from the requirement text: no requirement classifier
  // exists, and a guess here would land inside the task fingerprint that
  // gates project-memory retrieval and routing. See
  // coordinator.TaskIntakeRequest.
  string task_class = 5;

  // repository_revision, baseline_model_revision, tool_configuration_version,
  // and validation_profile_version pin the environment a forecast is made
  // against. They are OBSERVED, not chosen, so a caller that leaves them empty
  // gets the coordinator's own reading rather than a refusal: a browser
  // inventing a toolchain version would be exactly the guess this contract
  // exists to prevent. task_class has no such source and stays required.
  string repository_revision = 6;
  string baseline_model_revision = 7;
  string tool_configuration_version = 8;
  string validation_profile_version = 9;

  // Structured scope hints. Optional, but they are what project-memory
  // retrieval matches on; the requirement prose is never matched against.
  repeated string affected_paths = 10;
  repeated string affected_packages = 11;
  repeated string affected_symbols = 12;
}

message CreateTaskResponse {
  TaskView task = 1;
}

message GetTaskRequest {
  StableIdentity task_id = 1;
}

message GetTaskResponse {
  TaskView task = 1;
}

// ApprovePlanRequest records the person's decision to run a created task.
//
// A created task is Draft: it has a policy, an effort forecast, and a hard
// budget to review, and nothing binds it to execution. Reaching Ready requires
// a granted approval, and binding the reviewed policy/forecast/budget requires
// Ready. Both were reachable only from inside the process, so no client could
// start anything: a request became a draft task and stopped there.
message ApprovePlanRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
}

message ApprovePlanResponse {
  TaskView task = 1;

  // The immutable policy/forecast/budget binding this approval produced.
  // StartTask names it back, which is what makes "start exactly what was
  // reviewed" enforceable rather than advisory.
  uint64 preflight_revision = 2;
}

message StartTaskRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  uint64 approved_plan_revision = 3;

  // The exact execution preflight the user approved. StartPreparedTaskRun
  // validates against this binding, so naming it here is what makes "start
  // exactly what was reviewed" enforceable rather than advisory. It is
  // distinct from approved_plan_revision: one identifies the reviewed plan,
  // the other the immutable policy/forecast/budget binding.
  uint64 preflight_revision = 4;
}

message StartTaskResponse {
  TaskView task = 1;
}

message PauseTaskRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  string reason = 3;
}

message PauseTaskResponse {
  TaskView task = 1;
}

message ResumeTaskRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
}

message ResumeTaskResponse {
  TaskView task = 1;
}

message CancelTaskRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  string reason = 3;
}

message CancelTaskResponse {
  TaskView task = 1;
}

message ApproveActionRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  StableIdentity approval_id = 3;
  string decision = 4;
  string scope = 5;
}

message ApproveActionResponse {
  TaskView task = 1;
  uint64 approval_revision = 2;
}

message SetBudgetRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  Money hard_limit = 3;
}

message SetBudgetResponse {
  BudgetView budget = 1;
}

message RequestRepairRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  string feedback = 3;
  repeated StableIdentity evidence_ids = 4;
  string review_id = 5;
  uint64 expected_review_revision = 6;
  string expected_report_id = 7;
  string expected_diff_identity = 8;
  repeated ReviewRepairTarget targets = 9;
  StableIdentity checkpoint_id = 10;
  StableIdentity feedback_message_id = 11;
