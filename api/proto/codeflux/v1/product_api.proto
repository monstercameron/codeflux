// SpendCost is one exact recorded cost, presented at a scale fine enough for a
// single model call.
//
// amount is absent when the cost is unknown, following Money: an unknown cost
// is never a zero. A single call routinely costs a fraction of one minor unit,
// so amount carries extra decimal places rather than whole cents, and exact
// says whether that scale held the recorded rational value or rounded it.
message SpendCost {
  Money amount = 1;
  bool exact = 2;
}

// SpendSliceView is usage and cost for one grouping key.
//
// The unknown counts are separate fields rather than an absence, because the
// caller needs both halves: what was spent, and how many calls could not be
// measured or priced at all.
message SpendSliceView {
  uint64 calls = 1;
  uint64 input_tokens = 2;
  uint64 cached_input_tokens = 3;
  uint64 cache_write_tokens = 4;
  uint64 output_tokens = 5;
  uint64 reasoning_tokens = 6;
  SpendCost known_cost = 7;
  uint64 usage_unknown_calls = 8;
  uint64 cost_unknown_calls = 9;
}

// PhaseSpendView is what one movement of the flow cost: the atoms, the
// molecules, the program.
message PhaseSpendView {
  string phase = 1;
  SpendSliceView spend = 2;
}

message StageSpendView {
  uint32 stage_number = 1;
  string stage_name = 2;
  string phase = 3;
  SpendSliceView spend = 4;
}

message ModelSpendView {
  string provider_id = 1;
  string model = 2;
  string model_version = 3;
  SpendSliceView spend = 4;
}

message GetSpendSummaryRequest {
  StableIdentity workspace_id = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
}

message GetSpendSummaryResponse {
  // total covers every recorded call in the window, including the calls no
  // stage claimed. by_phase and by_stage therefore need not sum to it.
  SpendSliceView total = 1;
  repeated PhaseSpendView by_phase = 2;
  repeated StageSpendView by_stage = 3;
  // by_model is exact: the model is recorded on the request itself.
  repeated ModelSpendView by_model = 4;
  // unattributed is the difference between total and the phases, reported so
  // that a gap is explained rather than merely visible.
  SpendSliceView unattributed = 5;
  // stage_attribution_approximate is true whenever by_phase and by_stage were
  // derived by matching call times against stage records rather than from a
  // stage recorded on the call. The client must label them as estimates.
  bool stage_attribution_approximate = 6;
}

service SessionService {
  rpc GetSessionSnapshot(GetSessionSnapshotRequest) returns (GetSessionSnapshotResponse);
  rpc SubscribeSession(SubscribeSessionRequest) returns (stream SubscribeSessionResponse);
}

message GetSessionSnapshotRequest {
  StableIdentity session_id = 1;
}

message GetSessionSnapshotResponse {
  SessionProjectionSnapshot snapshot = 1;
}

// SessionProjectionSnapshot is the complete correctness-bearing frontend base
// atomically observed through one committed session sequence. Query-only task
// metadata such as provider/model selection, forecasts, and pricing identities
// deliberately does not appear here.
message SessionProjectionSnapshot {
  StableIdentity session_id = 1;
  StableIdentity thread_id = 2;
  StableIdentity task_id = 3;
  uint64 through_sequence = 4;
  google.protobuf.Timestamp observed_at = 5;
  string task_state = 6;
  uint64 task_revision = 7;
  PlanEvent plan = 8;
  string plan_approval_state = 9;
  ApprovalEvent pending_approval = 10;
  uint64 approval_revision = 11;
  BudgetEvent budget = 12;
  uint64 budget_revision = 13;
  ValidationEvent validation = 14;
  uint64 validation_revision = 15;
  CheckpointEvent checkpoint = 16;
  uint64 checkpoint_revision = 17;
  google.protobuf.Timestamp checkpoint_created_at = 18;
  RecoveryRequiredEvent recovery = 19;
  uint64 recovery_revision = 20;
  ChangeAcceptanceEvent change_acceptance = 21;
  uint64 change_acceptance_revision = 22;
  ToolEvent tool = 23;
  uint64 tool_revision = 24;
  SessionRevisionBindings review_bindings = 25;
  uint64 review_revision = 26;
  uint64 graph_revision = 27;
  repeated string denied_task_actions = 28;
  string task_action_policy_reason = 29;
}

message SessionRevisionBindings {
  uint64 diff_revision = 1;
  uint64 plan_revision = 2;
  uint64 validation_revision = 3;
  uint64 evidence_revision = 4;
  uint64 graph_revision = 5;
}

message SubscribeSessionRequest {
  StableIdentity session_id = 1;
  uint64 after_sequence = 2;
}

message SubscribeSessionResponse {
  SessionEvent event = 1;
  SessionReplayBoundary replay_boundary = 2;
}

// SessionReplayBoundary is emitted exactly once after every event committed at
// subscription time has been delivered. Events after this boundary are live.
message SessionReplayBoundary {
  uint64 through_sequence = 1;
}

// CodeCollectionService reads what code a repository contains at an exact
// revision: its packages, its declarations, and the documentation a
// declaration carries about itself. It is strictly read-only. Nothing here
// writes source, and no response carries a declaration's body — this is a
// directory of what the collection offers, not an editor.
service CodeCollectionService {
  rpc ListCodePackages(ListCodePackagesRequest) returns (ListCodePackagesResponse);
  rpc ListCodeSymbols(ListCodeSymbolsRequest) returns (ListCodeSymbolsResponse);
  rpc InspectCodeSymbol(InspectCodeSymbolRequest) returns (InspectCodeSymbolResponse);
  // ListCodeFiles returns every file the repository map recorded, so a client
  // can draw the collection as the tree it is on disk rather than as the flat
  // list of packages the mapper happens to group it into.
  rpc ListCodeFiles(ListCodeFilesRequest) returns (ListCodeFilesResponse);
  // ReadCodeFile returns one file's text. It is the one read in this service
  // that carries source, and it is bounded: a directory of code that cannot
  // show a file is a directory nobody can act on, but a read with no ceiling
  // is a way to hand a browser an arbitrarily large file.
  rpc ReadCodeFile(ReadCodeFileRequest) returns (ReadCodeFileResponse);
}

// CodeFileView is one file in the collection.
message CodeFileView {
  string workspace_relative_path = 1;
  // kind is "source", "test" or whatever else the mapper recorded, and
  // generated marks a file nobody wrote by hand.
  string kind = 2;
  bool generated = 3;
  string import_path = 4;
  uint32 symbol_count = 5;
  uint32 atom_count = 6;
}

message ListCodeFilesRequest {
  StableIdentity repository_id = 1;
  string search = 2;
  PageRequest page = 3;
}

message ListCodeFilesResponse {
  CodeCollectionRevisionView revision = 1;
  repeated CodeFileView files = 2;
  PageInfo page = 3;
  uint32 total_files = 4;
}

message ReadCodeFileRequest {
  StableIdentity repository_id = 1;
  string workspace_relative_path = 2;
}

message ReadCodeFileResponse {
  CodeCollectionRevisionView revision = 1;
  CodeFileView file = 2;
  // text is the file exactly as it is on disk, truncated at a bound that the
  // response reports rather than hides.
  RedactedText text = 3;
  uint32 line_count = 4;
  bool truncated = 5;
  // declarations are what this file declares, in the order they appear, so a
  // reader can jump to one and see which are atoms.
  repeated CodeSymbolView declarations = 6;
}

// CodeCollectionRevisionView states which repository revision an answer
// describes. Every response carries it, because a directory of code that does
// not say which revision it read will eventually describe a tree that moved on.
message CodeCollectionRevisionView {
  string revision = 1;
  bool dirty = 2;
  repeated RedactedText warnings = 3;
}

message CodePackageView {
  string import_path = 1;
  string name = 2;
  string module_path = 3;
  uint32 file_count = 4;
  uint32 test_file_count = 5;
  uint32 symbol_count = 6;
  uint32 atom_count = 7;
}

message CodeSymbolView {
  // key is the opaque identity InspectCodeSymbol accepts. It is never a path a
  // caller can act on directly.
  string key = 1;
  string name = 2;
  string kind = 3;
  string receiver = 4;
  string import_path = 5;
  string workspace_relative_path = 6;
  uint32 line = 7;
  bool exported = 8;
  // atom reports an admitted atom: the declaration carries the directive and
  // its documentation parsed. atom_problem carries why a directive-bearing
  // declaration was not admitted.
  bool atom = 9;
  string atom_problem = 10;
  // matched_name and matched_promise say why a search returned this row: the
  // term is in the declaration's own name, or it is in the documented text
  // quoted here. A result list that cannot say why a row is in it is one a
  // person has to take on faith, and a correct answer then reads as a broken
  // search. Both are empty outside a search.
  bool matched_name = 11;
  RedactedText matched_promise = 12;
}

message CodeSymbolReferenceView {
  string name = 1;
  string workspace_relative_path = 2;
  uint32 line = 3;
}

message CodeAtomFieldView {
  string label = 1;
  RedactedText text = 2;
  repeated RedactedText items = 3;
}

message ListCodePackagesRequest {
  StableIdentity repository_id = 1;
  string search = 2;
  PageRequest page = 3;
}

message ListCodePackagesResponse {
  CodeCollectionRevisionView revision = 1;
  repeated CodePackageView packages = 2;
  PageInfo page = 3;
  uint32 total_packages = 4;
  uint32 total_symbols = 5;
  uint32 total_atoms = 6;
}

message ListCodeSymbolsRequest {
  StableIdentity repository_id = 1;
  string import_path = 2;
  string search = 3;
  bool exported_only = 4;
  bool atoms_only = 5;
  PageRequest page = 6;
}

message ListCodeSymbolsResponse {
  CodeCollectionRevisionView revision = 1;
  repeated CodeSymbolView symbols = 2;
  PageInfo page = 3;
  uint32 total_matched = 4;
  // total_atoms is how many admitted atoms the collection holds, regardless of
  // what this query matched. A surface that reported only the matches told a
  // person who searched for one atom that the repository contained one.
  uint32 total_atoms = 5;
  // search_query is the SQL this search performed, with the match expression
  // and the bound written in. It is empty when nothing was searched.
  string search_query = 6;
}

message InspectCodeSymbolRequest {
  StableIdentity repository_id = 1;
  string key = 2;
}

message InspectCodeSymbolResponse {
  CodeCollectionRevisionView revision = 1;
  CodeSymbolView symbol = 2;
  // signature is the declaration without its body.
  RedactedText signature = 3;
  // documentation is the declaration's own comment, unchanged and never
  // generated.
  repeated RedactedText documentation = 4;
  string atom_opening_sentence = 5;
  uint32 atom_schema_version = 6;
  repeated CodeAtomFieldView atom_fields = 7;
  repeated CodeSymbolReferenceView callers = 8;
  repeated CodeSymbolReferenceView callees = 9;
  repeated string implements = 10;
  repeated string implemented_by = 11;
  // source is the declaration exactly as written, including the comment above
  // it. A promise stated in a comment is only worth as much as the code under
  // it, so the surface that shows the promise has to be able to show the code.
  // source_start_line is the file line the first returned line came from, so a
  // reader can cite what they are looking at.
  RedactedText source = 12;
  uint32 source_start_line = 13;
  bool source_truncated = 14;
  // tests are the declarations in test files that reference this one. They are
  // separated from callers because "what exercises this" and "what depends on
  // this" are different questions, and only one of them is evidence.
  repeated CodeSymbolReferenceView tests = 15;
  // naming_checked reports that the product's own atom-naming grammar was run
  // against this declaration's name; naming_finding is empty when the name
  // passes and states the violation when it does not. A name is part of an
  // atom's contract: it is what a caller reads first and the only part they
  // cannot avoid reading.
  bool naming_checked = 16;
  RedactedText naming_finding = 17;
  // structure is what the run's own atom stages measure about this
  // declaration: the loop nesting StageAtomComplexity turns into a time bound,
  // the decision points StageAtomCaseSynthesis turns into cases to cover, and
  // the purity StageAtoms tests for.
  CodeSymbolStructureView structure = 18;
  // documented_fields and missing_fields are the schema's own canonical field
  // list, split by whether this atom declares them. An atom that documents
  // twelve of nineteen fields is a different thing from one that documents all
  // of them, and only the list says which seven are missing.
  repeated string documented_fields = 19;
  repeated string missing_fields = 20;
  // access_query is the SQL that reads this atom back out of the coordinator's
  // atom index, and index_schema is the table it runs against. They are the
  // statements the coordinator itself executes rather than a rendering of
  // them: a query rewritten for display drifts from the one that ran, and then
  // the console teaches something that is no longer true.
  string access_query = 21;
  string index_schema = 22;
}

// CodeSymbolStructureView is the structural measurement of one declaration.
//
// measured separates "nothing was measured" from "measured, and the answer is
// zero": a declaration with no loops is O(1), one that was never looked at is
// unknown, and those are not the same claim.
message CodeSymbolStructureView {
  bool measured = 1;
  string time_bound = 2;
  string space_claim = 3;
  uint32 loop_depth = 4;
  uint32 branches = 5;
  bool pure = 6;
}

// FlowSettingView is one choice the run flow leaves to the person running it,
// carrying both what it is and what it is currently set to.
//
// The description travels with the value because the two drift apart
// otherwise: a bound changed in the engine and not in the interface produces a
// control that offers a value the engine will refuse. A client renders this
// without knowing what any individual setting means.
message FlowSettingView {
  string key = 1;
  string label = 2;
  // help says what the setting costs and what it buys, in the terms of
  // someone deciding whether to change it.
  RedactedText help = 3;
  // kind is "choice", "number", "switch", "set", "sequence" or "mapping" and
  // decides how the setting is rendered and which value field carries it.
  string kind = 4;
  repeated string choices = 5;
  int32 minimum = 6;
  int32 maximum = 7;
  // group lets a page put related controls together without inventing its own
  // taxonomy.
  string group = 8;
  string text_value = 9;
  int32 number_value = 10;
  bool switch_value = 11;
  // at_default reports that the value in force is the one the engine ships
  // with. A settings surface can then show where this machine has departed
  // from the defaults, which is the question somebody reviewing a
  // configuration is actually asking.
  bool at_default = 12;
  // item_values carries a "set" or a "sequence". For a sequence the order is
  // the setting, so a client must render and return it unchanged unless the
  // person reorders it.
  repeated string item_values = 13;
  // pair_values carries a "mapping": named keys each given one of the choices.
  repeated FlowSettingPair pair_values = 14;
}

// FlowSettingPair is one named key and the choice given to it.
//
// A map field would say the same thing and would say it in a different order
// on every read, which turns an unchanged configuration into a changed one
// everywhere the two are compared.
message FlowSettingPair {
  string key = 1;
  string value = 2;
}

message GetFlowSettingsRequest {
  StableIdentity workspace_id = 1;
}

message GetFlowSettingsResponse {
  repeated FlowSettingView settings = 1;
  // revision is the settings revision these values came from. Zero means no
  // layer has been written and compiled defaults are in force.
  uint64 revision = 2;
  // unrenderable names settings the engine declares in a shape this contract
  // cannot carry. They are reported rather than dropped silently, because a
  // page missing a row nobody mentioned understates what governs a run.
  repeated string unrenderable = 3;
}

// FlowSettingChange names one setting and its new value. Only the field
// matching the setting's kind is read.
message FlowSettingChange {
  string key = 1;
  string text_value = 2;
  int32 number_value = 3;
  bool switch_value = 4;
  // item_values replaces the whole list. An empty list clears the setting
  // rather than leaving it alone, so a client that means "no change" omits the
  // change entirely.
  repeated string item_values = 5;
  // pair_values replaces the whole mapping, on the same rule.
  repeated FlowSettingPair pair_values = 6;
}

message SetFlowSettingsRequest {
  MutationControl control = 1;
  StableIdentity workspace_id = 2;
  repeated FlowSettingChange changes = 3;
}

message SetFlowSettingsResponse {
  repeated FlowSettingView settings = 1;
  uint64 revision = 2;
  repeated string unrenderable = 3;
}
