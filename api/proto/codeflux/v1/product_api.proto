message ReconcileRecoveryRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  string reason = 3;
}

message ReconcileRecoveryResponse {
  StableIdentity task_id = 1;
  string assessment_id = 2;
  StableIdentity checkpoint_id = 3;
  string state = 4;
  uint64 revision = 5;
}

message SafeResumeRecoveryRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  string reason = 3;
}

message SafeResumeRecoveryResponse {
  StableIdentity task_id = 1;
  string assessment_id = 2;
  StableIdentity checkpoint_id = 3;
  string state = 4;
  uint64 revision = 5;
}

service GraphService {
  rpc GetGraphSlice(GetGraphSliceRequest) returns (GetGraphSliceResponse);
  rpc ExpandGraph(ExpandGraphRequest) returns (ExpandGraphResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc SearchGraph(SearchGraphRequest) returns (SearchGraphResponse);
  rpc ExplainNode(ExplainNodeRequest) returns (ExplainNodeResponse);
  rpc CompareGraphRevisions(CompareGraphRevisionsRequest) returns (CompareGraphRevisionsResponse);
}

message GetGraphSliceRequest {
  StableIdentity task_id = 1;
  string mode = 2;
  uint32 max_nodes = 3;
  uint32 max_edges = 4;
  StableIdentity project_id = 5;
  StableIdentity expected_graph_revision_id = 6;
  string continuation_cursor = 7;
  string layout_algorithm = 8;
  uint64 layout_algorithm_version = 9;
}

message GetGraphSliceResponse {
  GraphSliceView graph = 1;
}

message ExpandGraphRequest {
  StableIdentity graph_revision_id = 1;
  repeated StableIdentity root_node_ids = 2;
  string continuation_cursor = 3;
  uint32 max_nodes = 4;
  uint32 max_edges = 5;
  StableIdentity project_id = 6;
  StableIdentity task_id = 7;
  string mode = 8;
  string traversal = 9;
  uint32 max_hops = 10;
  string layout_algorithm = 11;
  uint64 layout_algorithm_version = 12;
}

message ExpandGraphResponse {
  GraphSliceView graph = 1;
}

message GetNodeRequest {
  StableIdentity graph_revision_id = 1;
  StableIdentity node_id = 2;
  StableIdentity project_id = 3;
  StableIdentity task_id = 4;
  string layout_algorithm = 5;
  uint64 layout_algorithm_version = 6;
}

message GetNodeResponse {
  GraphNodeView node = 1;
  repeated StableIdentity related_message_ids = 2;
  repeated StableIdentity evidence_ids = 3;
}

message SearchGraphRequest {
  StableIdentity project_id = 1;
  StableIdentity task_id = 2;
  StableIdentity graph_revision_id = 3;
  string mode = 4;
  string query = 5;
  uint32 max_results = 6;
  string continuation_cursor = 7;
  string layout_algorithm = 8;
  uint64 layout_algorithm_version = 9;
}

message SearchGraphResponse {
  GraphSliceView graph = 1;
}

message ExplainNodeRequest {
  StableIdentity graph_revision_id = 1;
  StableIdentity node_id = 2;
  StableIdentity project_id = 3;
  StableIdentity task_id = 4;
  string layout_algorithm = 5;
  uint64 layout_algorithm_version = 6;
}

message ExplainNodeResponse {
  GraphNodeView node = 1;
  RedactedText explanation = 2;
}

message CompareGraphRevisionsRequest {
  StableIdentity from_graph_revision_id = 1;
  StableIdentity to_graph_revision_id = 2;
  uint32 max_changes = 3;
  string continuation_cursor = 4;
  StableIdentity project_id = 5;
  StableIdentity task_id = 6;
}

message CompareGraphRevisionsResponse {
  repeated GraphNodeView added_nodes = 1;
  repeated GraphNodeView changed_nodes = 2;
  repeated StableIdentity removed_node_ids = 3;
  string continuation_cursor = 4;
  bool truncated = 5;
  repeated GraphRevisionChangeView changes = 6;
  StableIdentity from_graph_id = 7;
  uint64 from_revision = 8;
  StableIdentity to_graph_id = 9;
  uint64 to_revision = 10;
}

service ReviewService {
  rpc GetDiffSummary(GetDiffSummaryRequest) returns (GetDiffSummaryResponse);
  rpc GetValidationReport(GetValidationReportRequest) returns (GetValidationReportResponse);
  rpc GetEvidenceReport(GetEvidenceReportRequest) returns (GetEvidenceReportResponse);
  rpc AcceptChange(AcceptChangeRequest) returns (AcceptChangeResponse);
  rpc RequestRepair(ReviewServiceRequestRepairRequest) returns (ReviewServiceRequestRepairResponse);
  rpc RejectChange(RejectChangeRequest) returns (RejectChangeResponse);
  rpc RollbackTask(ReviewServiceRollbackTaskRequest) returns (ReviewServiceRollbackTaskResponse);
  rpc OpenInEditor(OpenInEditorRequest) returns (OpenInEditorResponse);
}

message GetDiffSummaryRequest {
  StableIdentity task_id = 1;
}

message ReviewServiceRequestRepairRequest {
  RequestRepairRequest request = 1;
}

message ReviewServiceRequestRepairResponse {
  RequestRepairResponse result = 1;
}

message ReviewServiceRollbackTaskRequest {
  RollbackTaskRequest request = 1;
}

message ReviewServiceRollbackTaskResponse {
  RollbackTaskResponse result = 1;
}

message GetDiffSummaryResponse {
  DiffSummaryView diff = 1;
}

message GetValidationReportRequest {
  StableIdentity task_id = 1;
}

message GetValidationReportResponse {
  ValidationReportView report = 1;
}

// GetEvidenceReport reads one sealed structured report and, when requested,
// the current bounded review diff. An empty report_id selects the latest
// sealed report for the task. The response explicitly says whether the live
// diff still matches the immutable report binding.
message GetEvidenceReportRequest {
  StableIdentity task_id = 1;
  string report_id = 2;
  bool include_diff = 3;
}

message ReviewPlanStepLinkView {
  uint64 plan_revision = 1;
  string step_id = 2;
}

message ReviewValidationLinkView {
  StableIdentity validation_id = 1;
  string state = 2;
  RedactedText label = 3;
  RedactedText summary = 4;
}

message ReviewDiffFileView {
  SafePath path = 1;
  SafePath previous_path = 2;
  string status = 3;
  string category = 4;
  uint64 added_lines = 5;
  uint64 deleted_lines = 6;
  bool line_counts_known = 7;
  RedactedText line_counts_unknown_reason = 8;
  bool binary = 9;
  bool formatting_churn = 10;
  bool scope_known = 11;
  bool in_scope = 12;
  RedactedText scope_unknown_reason = 13;
  repeated ReviewPlanStepLinkView plan_steps = 14;
  repeated StableIdentity tool_event_ids = 15;
  repeated ReviewValidationLinkView validations = 16;
}

message ReviewDiffView {
  StableIdentity task_id = 1;
  string diff_identity = 2;
  string base_revision = 3;
  string head_revision = 4;
  RedactedText unified_diff = 5;
  repeated ReviewDiffFileView files = 6;
}

message GetEvidenceReportResponse {
  // Canonical JSON encoding of the validated evidence.Report value. It is
  // bounded by the service and contains structured fields, never Markdown.
  bytes structured_report_json = 1;
  ReviewDiffView diff = 2;
  bool diff_matches_report = 3;
  string review_id = 4;
  uint64 review_revision = 5;
}

message AcceptChangeRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  string expected_diff_identity = 3;
  uint64 expected_validation_revision = 4;
  string review_id = 5;
  uint64 expected_review_revision = 6;
  string expected_report_id = 7;
  repeated string acknowledged_check_ids = 8;
  string acceptance_mode = 9;
  string author_name = 10;
  string author_email = 11;
  RedactedText commit_message = 12;
  RedactedText reason = 13;
}

message AcceptChangeResponse {
  TaskView task = 1;
  RedactedText acceptance_summary = 2;
  string acceptance_id = 3;
  string report_id = 4;
  string diff_identity = 5;
  string commit_revision = 6;
  bool patch_applied = 7;
}

message RejectChangeRequest {
  MutationControl control = 1;
  StableIdentity task_id = 2;
  string reason = 3;
  bool preserve_patch = 4;
  string review_id = 5;
  uint64 expected_review_revision = 6;
  string expected_report_id = 7;
  string expected_diff_identity = 8;
  StableIdentity checkpoint_id = 9;
}

message RejectChangeResponse {
  TaskView task = 1;
  string rejection_id = 2;
  string preserved_patch_path = 3;
}

message OpenInEditorRequest {
  MutationControl control = 1;
  StableIdentity workspace_id = 2;
  string workspace_relative_path = 3;
  uint32 line = 4;
  uint32 column = 5;
}

message OpenInEditorResponse {
  string decision = 1;
  SafePath path = 2;
}

service SettingsService {
